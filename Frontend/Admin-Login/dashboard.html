<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Centro VIAS – Administración</title>
    <link rel="stylesheet" href="Admin-Login.css" />
  </head>
  <body>
    <header>
      <div class="hd" style="max-width: 1200px; margin: auto">
        <div style="display: flex; align-items: center; gap: 14px">
          <img src="../Images/cropped-logo.png" alt="Logotipo de Centro VIAS" />
          <b style="color: var(--gd); font-size: 18px">Centro VIAS · Administración</b>
        </div>
        <nav aria-label="Navegación de administración">
          <a href="../index.html">Inicio</a>
          <a href="../Meet-The-Team-Page/Meet-The-Team-Page.html">Equipo</a>
          <a href="../Activites-Page/Activites.html">Actividades</a>
          <a href="../Donations-Page/Donations-Page.html">Donaciones</a>
          <a href="../Contact-Admission-Page/Contact-Admissions-Page.html">Contacto</a>
        </nav>
        <button class="btn o" id="logoutButton" type="button" style="min-height: 40px">Cerrar sesión</button>
      </div>
    </header>
    <main class="w" style="min-height: 620px; padding-top: 32px">
      <section class="card">
        <h1 style="font-size: 28px">Panel administrativo</h1>
        <p class="mut">Sesión administrativa iniciada.</p>
      </section>
      <section class="card moderation" aria-labelledby="review-queue-title">
        <h2 id="review-queue-title">Comentarios pendientes de revisión</h2>
        <p class="mut" id="review-queue-status" role="status" aria-live="polite">
          Cargando comentarios pendientes...
        </p>
        <div class="review-queue" id="review-queue"></div>
      </section>
    </main>
    <footer>
      <div class="w" style="padding: 20px 24px">
        <div class="fb" style="border: 0; margin: 0; padding: 0">
          © Centro VIAS
        </div>
      </div>
    </footer>
    <script src="dashboard.js"></script>
  </body>
</html>
